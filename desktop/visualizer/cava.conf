# cava settings for the Sakura Breeze wallpaper visualizer (raw numbers, no window)
[general]
framerate = 60
autosens = 1
bars = 56
lower_cutoff_freq = 40
higher_cutoff_freq = 14000
sleep_timer = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = stereo
reverse = 0

[smoothing]
monstercat = 1
noise_reduction = 70
