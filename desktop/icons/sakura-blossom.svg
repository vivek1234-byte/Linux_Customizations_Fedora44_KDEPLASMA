<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe0ec" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffe0ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="center_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5d4"/>
      <stop offset="60%" stop-color="#ffdb70"/>
      <stop offset="100%" stop-color="#e8a830"/>
    </radialGradient>
    <linearGradient id="petal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd4e8"/>
      <stop offset="40%" stop-color="#ffb0cb"/>
      <stop offset="100%" stop-color="#e87aa0"/>
    </linearGradient>
    <linearGradient id="petal2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffc8df"/>
      <stop offset="40%" stop-color="#ffa0bd"/>
      <stop offset="100%" stop-color="#dc6892"/>
    </linearGradient>
    <linearGradient id="petal3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffdcef"/>
      <stop offset="40%" stop-color="#ffb8d5"/>
      <stop offset="100%" stop-color="#e070a0"/>
    </linearGradient>
    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outer_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="200" fill="url(#glow)" filter="url(#outer_glow)"/>

  <g transform="translate(256,256)" filter="url(#soft_glow)">
    <!-- Petal 1 - top -->
    <path d="M0,-30 C-25,-80 -40,-150 -15,-180 C0,-195 0,-195 15,-180 C40,-150 25,-80 0,-30Z"
          fill="url(#petal1)" opacity="0.95"/>
    <!-- Petal 2 - top-right -->
    <path d="M0,-30 C-25,-80 -40,-150 -15,-180 C0,-195 0,-195 15,-180 C40,-150 25,-80 0,-30Z"
          fill="url(#petal2)" opacity="0.92" transform="rotate(72)"/>
    <!-- Petal 3 - bottom-right -->
    <path d="M0,-30 C-25,-80 -40,-150 -15,-180 C0,-195 0,-195 15,-180 C40,-150 25,-80 0,-30Z"
          fill="url(#petal3)" opacity="0.9" transform="rotate(144)"/>
    <!-- Petal 4 - bottom-left -->
    <path d="M0,-30 C-25,-80 -40,-150 -15,-180 C0,-195 0,-195 15,-180 C40,-150 25,-80 0,-30Z"
          fill="url(#petal1)" opacity="0.88" transform="rotate(216)"/>
    <!-- Petal 5 - top-left -->
    <path d="M0,-30 C-25,-80 -40,-150 -15,-180 C0,-195 0,-195 15,-180 C40,-150 25,-80 0,-30Z"
          fill="url(#petal2)" opacity="0.93" transform="rotate(288)"/>

    <!-- Inner petal accents (lighter highlights) -->
    <path d="M0,-35 C-12,-70 -18,-120 -6,-145 C0,-155 0,-155 6,-145 C18,-120 12,-70 0,-35Z"
          fill="#ffe8f2" opacity="0.4"/>
    <path d="M0,-35 C-12,-70 -18,-120 -6,-145 C0,-155 0,-155 6,-145 C18,-120 12,-70 0,-35Z"
          fill="#ffe8f2" opacity="0.35" transform="rotate(72)"/>
    <path d="M0,-35 C-12,-70 -18,-120 -6,-145 C0,-155 0,-155 6,-145 C18,-120 12,-70 0,-35Z"
          fill="#ffe8f2" opacity="0.3" transform="rotate(144)"/>
    <path d="M0,-35 C-12,-70 -18,-120 -6,-145 C0,-155 0,-155 6,-145 C18,-120 12,-70 0,-35Z"
          fill="#ffe8f2" opacity="0.3" transform="rotate(216)"/>
    <path d="M0,-35 C-12,-70 -18,-120 -6,-145 C0,-155 0,-155 6,-145 C18,-120 12,-70 0,-35Z"
          fill="#ffe8f2" opacity="0.35" transform="rotate(288)"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="28" fill="url(#center_grad)"/>
    <circle cx="0" cy="0" r="18" fill="#fff5d4" opacity="0.5"/>

    <!-- Stamens -->
    <g opacity="0.8">
      <line x1="0" y1="-5" x2="8" y2="-38" stroke="#e8a830" stroke-width="2" stroke-linecap="round"/>
      <circle cx="8" cy="-40" r="3.5" fill="#ffdb70"/>
      <line x1="0" y1="-5" x2="-10" y2="-36" stroke="#e8a830" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-10" cy="-38" r="3.5" fill="#ffe090"/>
      <line x1="0" y1="-5" x2="15" y2="-30" stroke="#e8a830" stroke-width="2" stroke-linecap="round"/>
      <circle cx="15" cy="-32" r="3" fill="#ffdb70"/>
      <line x1="0" y1="-5" x2="-5" y2="-40" stroke="#e8a830" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-5" cy="-42" r="3" fill="#ffe090"/>
      <line x1="0" y1="-5" x2="3" y2="-42" stroke="#e8a830" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="3" cy="-44" r="2.5" fill="#ffdb70"/>
    </g>
  </g>

  <!-- Floating petals (small decorative ones) -->
  <g opacity="0.5">
    <path d="M380,120 C370,105 375,85 385,80 C390,78 392,82 388,90 C384,100 382,115 380,120Z"
          fill="#ffb8d0" transform="rotate(15,380,100)"/>
    <path d="M420,380 C415,365 420,350 428,346 C432,344 434,348 430,355 C426,364 422,375 420,380Z"
          fill="#ffc8df" transform="rotate(-20,420,365)"/>
    <path d="M100,350 C95,340 98,325 105,320 C108,318 110,322 107,328 C104,336 102,345 100,350Z"
          fill="#ffd0e4" transform="rotate(30,100,335)"/>
  </g>
</svg>