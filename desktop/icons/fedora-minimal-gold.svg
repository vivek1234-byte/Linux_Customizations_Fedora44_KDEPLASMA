<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7417"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Subtle dark frosted circular back -->
  <circle cx="64" cy="64" r="58" fill="#1e1e24" fill-opacity="0.6" stroke="url(#amberGrad)" stroke-width="2.5" stroke-opacity="0.4"/>
  <!-- Minimalist Fedora 'f' infinity outline -->
  <g fill="none" stroke="url(#amberGrad)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 64,36 C 50,36 38,48 38,62 C 38,76 48,84 64,84 C 76,84 84,76 84,68 C 84,60 76,54 64,54 C 52,54 44,62 44,70" />
    <path d="M 64,28 L 64,96" stroke-width="7" />
    <path d="M 50,54 L 78,54" stroke-width="7" />
  </g>
</svg>