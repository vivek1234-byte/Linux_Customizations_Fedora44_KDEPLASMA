<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 128 128" width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#fda085" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Outer double ring crest -->
  <circle cx="64" cy="64" r="56" fill="#1a1c23" fill-opacity="0.75" stroke="url(#goldSunset)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#goldSunset)" stroke-width="1.2" stroke-opacity="0.7"/>
  <!-- Kanji 東 (Higashi / Tokyo) -->
  <g fill="url(#goldSunset)" filter="url(#glow)">
    <rect x="36" y="38" width="56" height="5.5" rx="2.5"/>
    <rect x="61" y="26" width="6" height="74" rx="3"/>
    <path d="M 40,51 H 88 V 69 H 40 Z" fill="none" stroke="url(#goldSunset)" stroke-width="5.5" stroke-linejoin="round"/>
    <line x1="40" y1="60" x2="88" y2="60" stroke="url(#goldSunset)" stroke-width="4.5"/>
    <path d="M 61,72 L 38,98" stroke="url(#goldSunset)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 67,72 L 90,98" stroke="url(#goldSunset)" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>