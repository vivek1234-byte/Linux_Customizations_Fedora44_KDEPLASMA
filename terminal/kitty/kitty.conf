# ── Font ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.5
disable_ligatures never

# ── Window look ─────────────────────────────────────
window_padding_width   14
hide_window_decorations no
background_opacity     0.88
background_blur        32
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size  no
initial_window_width  120c
initial_window_height 34c

# ── Cursor animations ───────────────────────────────
cursor_shape               beam
cursor_beam_thickness      2
cursor_blink_interval      0.6 ease-in-out
cursor_stop_blinking_after 0
cursor_trail               3
cursor_trail_decay         0.1 0.4
cursor_trail_start_threshold 2

# ── Visual bell / misc ──────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.25 ease-in-out
visual_bell_color #C3A6FF
url_style            curly
mouse_hide_wait      2.0

# ── Tabs (powerline style) ──────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index}: {title}"
active_tab_font_style bold

# ── Catppuccin Mocha colours ────────────────────────
foreground              #CDD6F4
background              #0E0C10
selection_foreground    #FFFFFF
selection_background #5E5A8C
cursor #F7A8C4
cursor_text_color #0E0C10
url_color #8EC5FF
active_border_color #C3A6FF
inactive_border_color   #6C7086
bell_border_color       #F9E2AF
active_tab_foreground #0E0C10
active_tab_background #C3A6FF
inactive_tab_foreground #CDD6F4
inactive_tab_background #18131A
tab_bar_background      #0B090C
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC
color0  #45475A
color8  #585B70
color1  #F38BA8
color9  #F38BA8
color2  #A6E3A1
color10 #A6E3A1
color3  #F9E2AF
color11 #F9E2AF
color4  #89B4FA
color12 #89B4FA
color5  #F5C2E7
color13 #F5C2E7
color6  #94E2D5
color14 #94E2D5
color7  #BAC2DE
color15 #A6ADC8

# ── Handy shortcuts ─────────────────────────────────
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
enabled_layouts splits,stack

# ── fastfetch picture: click it once to show the next picture ──
# (kitten ~/.config/kitty/ff_dclick.py -> ~/.config/fastfetch/ff-logo.py; clicks
#  elsewhere keep kitty's normal behaviour: links, prompt jumps, selection)
mouse_map left click ungrabbed combine : mouse_handle_click selection link prompt : kitten ff_dclick.py
